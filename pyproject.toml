[project]
name = "tokentracker"
version = "0.1.0"
description = "OTLP ingest server for Claude Code usage tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "opentelemetry-proto>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokentracker"]
