[project]
name = "tokentracker"
version = "0.1.0"
description = "OTLP ingest server for Claude Code usage tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "opentelemetry-proto>=1.27",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokentracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
