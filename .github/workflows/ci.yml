name: CI

# Fast feedback on every push and PR. Tests stub the database (see
# tests/conftest.py FakePool), so no Postgres service container is needed.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (incl. dev group)
        run: uv sync

      - name: Run tests
        run: uv run pytest
