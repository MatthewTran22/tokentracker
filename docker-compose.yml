services:
  # Local Postgres for dev. Opt in via `--profile local`:
  #   docker compose --profile local up -d
  # Without the flag, the app uses whatever DATABASE_URL .env provides (e.g. Neon).
  db:
    profiles: ["local"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokentracker
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tokentracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokentracker -d tokentracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # .env drives DATABASE_URL, AUTH_SECRET, COOKIE_SECURE, TRUST_PROXY, DB_POOL_MAX,
    # DB_DISABLE_PREPARE. Keep .env gitignored.
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
    # Dev-only override of the production CMD: --reload watches the bind-mounted source.
    command: uvicorn tokentracker.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

volumes:
  db_data:
