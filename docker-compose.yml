services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokentracker
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tokentracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokentracker -d tokentracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokentracker:dev@db:5432/tokentracker
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro

volumes:
  db_data:
